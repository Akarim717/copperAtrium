<style>:root { --of-k: 1; --ui: #2E3142; --ui-soft: #F3F6FB; --ui-line: #E2E7EF; --ui-accent: #4E9BEA; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #E9EDF3; color: var(--ui); font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #1B1E27; } }
:root[data-theme="dark"] body { background: #1B1E27; }

/* toolbar */
.of-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 16px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--ui-line); }
.of-bar .of-name { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 15px; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.of-bar button { font: 600 13px 'Inter', sans-serif; border: 1px solid var(--ui-line); background: #fff; color: var(--ui);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.of-bar button:hover { border-color: var(--ui-accent); }
.of-bar button.primary { background: var(--ui-accent); border-color: var(--ui-accent); color: #fff; }
.of-bar #of-warn { font: 600 12px 'Inter', sans-serif; color: #C2410C; }
.of-hint { display: none; width: 100%; font-size: 12px; color: #6B7080; }
body.of-editing .of-hint { display: block; }

/* slides */
#of-root { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 28px 16px 64px; }
.of-wrap { position: relative; width: calc(1280px * var(--of-k)); height: calc(720px * var(--of-k)); }
.of-slide { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden; background: #fff;
  transform: scale(var(--of-k)); transform-origin: 0 0; border-radius: 6px; box-shadow: 0 10px 30px rgba(30,42,74,.10); }
.of-slide > div { position: absolute; }
.of-line { transform-origin: 0 50%; }
.of-img { background-size: cover; background-position: center; background-color: #F3F6FB; overflow: hidden; }
.of-img.empty { display: flex; align-items: center; justify-content: center; color: #9AA1B2; font: 500 14px 'Inter', sans-serif;
  border: 2px dashed #D5DCE7; }
.of-text { display: flex; flex-direction: column; outline: none; }
.of-text .of-t { white-space: pre-wrap; }
.of-text ul { margin: 0; padding: 0; list-style: none; }
.of-text li { position: relative; padding-left: 1.25em; margin-bottom: .35em; }
.of-text li::before { content: ''; position: absolute; left: .15em; top: .55em; width: .48em; height: .48em; border-radius: 50%; background: #5CC6DE; }

.of-slidebar { position: absolute; right: 0; top: -26px; display: none; gap: 4px; align-items: center; font: 600 11px 'Inter', sans-serif; color: #6B7080; }
.of-slidebar span { margin-right: 6px; text-transform: uppercase; letter-spacing: .06em; }
.of-slidebar button { font: 600 11px 'Inter', sans-serif; border: 1px solid var(--ui-line); background: #fff; border-radius: 999px; padding: 3px 9px; cursor: pointer; color: var(--ui); }
body.of-editing .of-slidebar { display: flex; }
body.of-editing .of-text.editable { cursor: text; }
body.of-editing .of-text.editable:hover, body.of-editing .of-text.editable:focus { box-shadow: 0 0 0 2px rgba(78,155,234,.55); border-radius: 3px; }
body.of-editing .of-img { cursor: pointer; }
body.of-editing .of-img:hover { box-shadow: 0 0 0 3px rgba(78,155,234,.7); }
body.of-editing .of-text.overflow, body.of-check .of-text.overflow { box-shadow: 0 0 0 2px #F97316 !important; }

/* present mode */
body.of-present .of-bar { display: none; }
body.of-present { background: #000; overflow: hidden; }
body.of-present #of-root { padding: 0; gap: 0; height: 100vh; justify-content: center; }
body.of-present .of-wrap { display: none; }
body.of-present .of-wrap.on { display: block; }
body.of-present .of-slide { border-radius: 0; box-shadow: none; }

@media (max-width: 640px) { .of-bar .of-name { max-width: 100%; width: 100%; } }

/* print = PDF, one slide per page, exact size */
@page { size: 13.333in 7.5in; margin: 0; }
@media print {
  html, body { background: #fff !important; }
  .of-bar, .of-slidebar { display: none !important; }
  #of-root { display: block; padding: 0; }
  .of-wrap { width: 1280px; height: 720px; page-break-after: always; break-after: page; }
  .of-wrap:last-child { page-break-after: auto; break-after: auto; }
  .of-slide { transform: none; border-radius: 0; box-shadow: none; }
  .of-text.overflow { box-shadow: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>

      e.push(txt('people.' + i + '.role', cx - cw / 2 + 0.15, 5.24, cw - 0.3, 0.3, { size: 11.5, weight: 500, color: C.kicker, align: 'center', lh: 1.2 }));
      e.push(txt('people.' + i + '.text', cx - cw / 2 + 0.3, 5.6, cw - 0.6, 1.2, { size: 11.5, color: C.muted, align: 'center', lh: 1.45 }));
    });
    return e;
  };

  // 8. Numbers that matter
  L.stats = function (s) {
    var e = [], st = (s.stats || []).slice(0, 3);
    e.push(quarter(0, H, 0.8, 'yellow'));
    e = e.concat(dots(1.0, 0.45, 8, 1, 'cyan'));
    e.push(kicker(s, 1.0, 1.05));
    e.push(head('title', 1.0, 1.45, 4.7, 2.4, 36));
    e.push(txt('body', 1.0, 3.75, 4.3, 2.2, { size: 14, lh: 1.55 }));
    e.push(rect(5.95, 0.9, 0.04, 5.7, 'line'));
    st.forEach(function (it, i) {
      var y = 0.95 + i * 1.95;
      e.push(head('stats.' + i + '.value', 6.5, y, 3.0, 1.0, 50, { lh: 1 }));
      e.push(rect(6.5, y + 1.08, 0.9, 0.09, CYCLE[i % 3]));
      e.push(head('stats.' + i + '.label', 9.6, y + 0.12, 3.0, 0.42, 15, { weight: 800, lh: 1.15 }));
      e.push(txt('stats.' + i + '.text', 9.6, y + 0.55, 3.0, 1.15, { size: 11.5, color: C.muted, lh: 1.45 }));
    });
    return e;
  };

  // 9. Big quote with a portrait
  L.quote = function (s) {
    var e = [];
    e.push(ell(9.35, 0.65, 4.2, 'blue'));
    e.push(ring(8.48, 1.08, 4.04, 'cyan', 3));
    e.push(img('person.portrait', 8.62, 1.22, 3.76, 3.76, { circle: true }));
    e.push(ell(11.85, 4.75, 0.75, 'yellow'));
    e = e.concat(dots(10.4, 5.85, 7, 4, 'cyan'));
    e.push(txt('__q', 0.92, 0.55, 1.6, 1.6, { font: 'head', weight: 900, size: 130, color: C.cyan, lh: 1, value: '“', locked: true }));
    e.push(head('quote', 1.0, 2.0, 6.9, 2.9, 27, { weight: 800, lh: 1.28 }));
    e.push(rect(1.0, 5.15, 0.8, 0.09, 'yellow'));
    e.push(txt('person.name', 1.0, 5.45, 6, 0.32, { size: 14, weight: 600, color: C.ink, lh: 1.2 }));
    e.push(txt('person.role', 1.0, 5.8, 6, 0.3, { size: 11.5, color: C.muted, lh: 1.2 }));
    return e;
  };

  // 10. Spotlight: big image with an overlapping card
  L.spotlight = function (s) {
    var e = [];
    e.push(img('image', 1.0, 0.75, 7.6, 6.0, { radii: [0.35, 0.35, 0.35, 0.35] }));
    e.push(rect(12.71, 0, W - 12.71, H, 'blue'));
    e = e.concat(dots(0.45, 4.9, 3, 6, 'cyan'));
    e = e.concat(zig(9.2, 0.95, 1.2, 0.14, 4, 'yellow', 2));
    e.push(rect(7.55, 1.65, 4.85, 4.35, 'white', { r: 0.28, shadow: true }));
    e.push(kicker(s, 8.0, 2.05, 4.0));
    e.push(head('title', 8.0, 2.45, 4.0, 1.45, 25, { lh: 1.08 }));
    e.push(txt('body', 8.0, 3.95, 4.0, 1.85, { size: 13, lh: 1.55 }));
    return e;
  };

  // 11. Closing / call to action
  L.closing = function (s) {
    var e = [], det = (s.details || []).slice(0, 4);
    e.push(ell(9.1, 0.45, 5.0, 'blue'));
    e.push(img('image', 7.95, 1.25, 4.8, 4.8, { circle: true }));
    e.push(quarter(0, H, 0.8, 'yellow'));
    e = e.concat(dots(7.4, 5.75, 5, 4, 'cyan'));
    e.push(kicker(s, 1.0, 0.95));
    e.push(head('title', 1.0, 1.35, 6.3, 2.5, 44, { lh: 1.02 }));
    det.forEach(function (d, i) {
      var y = 4.05 + i * 0.5;
      e.push(txt('details.' + i + '.label', 1.0, y, 1.5, 0.3, { size: 10.5, weight: 600, color: C.kicker, lh: 1.3 }));
      e.push(txt('details.' + i + '.value', 2.6, y - 0.02, 4.6, 0.34, { size: 14, color: C.ink, lh: 1.3 }));
    });
    if (has(s, 'cta')) {
      e.push(rect(1.0, 6.2, 2.9, 0.62, 'blue', { r: 0.31 }));
      e.push(txt('cta', 1.0, 6.2, 2.9, 0.62, { size: 13.5, weight: 700, color: C.white, align: 'center', valign: 'middle', lh: 1 }));
    }
    return e;
  };

  function mirror(els) {
    return els.map(function (el) {
      var c = Object.assign({}, el);
      if (c.t === 'line') { c.x1 = W - el.x1; c.x2 = W - el.x2; return c; }
      c.x = W - el.x - el.w;
      if (c.radii) c.radii = [el.radii[1], el.radii[0], el.radii[3], el.radii[2]];
      return c;
    });
  }

  function scene(slide, ctx) {
    var f = L[slide.layout] || L.split;
    return f(slide, ctx).concat(folio(ctx, slide));
  }

  /* ======================= Browser renderer ======================= */
  var model, editing = false, root;

  function px(v) { return (v * PX).toFixed(2) + 'px'; }
  function fontStack(f) { return f === 'head' ? "'Montserrat', 'Arial Black', sans-serif" : "'Inter', 'Helvetica Neue', Arial, sans-serif"; }

  function renderAll() {
    root.innerHTML = '';
    model.slides.forEach(function (s, i) { root.appendChild(renderSlide(s, i)); });
    fitScale(); checkOverflow();
  }

  function renderSlide(s, i) {
    var wrap = document.createElement('section'); wrap.className = 'of-wrap';
    var el = document.createElement('div'); el.className = 'of-slide'; el.dataset.i = i;
    var ctx = { i: i, n: model.slides.length, footer: (model.meta || {}).footer };
    scene(s, ctx).forEach(function (n) { el.appendChild(node(n, s, i)); });
    wrap.appendChild(el);
    var bar = document.createElement('div'); bar.className = 'of-slidebar';
    bar.innerHTML = '<span>' + (i + 1) + ' · ' + s.layout + '</span>' +
      '<button data-a="up" title="Move up">↑</button><button data-a="down" title="Move down">↓</button>' +
      '<button data-a="dup" title="Duplicate">Duplicate</button><button data-a="del" title="Delete">Delete</button>';
    bar.addEventListener('click', function (ev) {
      var a = ev.target.dataset.a; if (!a) return;
      var S = model.slides;
      if (a === 'dup') S.splice(i + 1, 0, JSON.parse(JSON.stringify(S[i])));
      if (a === 'del' && S.length > 1 && confirm('Delete slide ' + (i + 1) + '?')) S.splice(i, 1);
      if (a === 'up' && i > 0) S.splice(i - 1, 0, S.splice(i, 1)[0]);
      if (a === 'down' && i < S.length - 1) S.splice(i + 1, 0, S.splice(i, 1)[0]);
      persist(); renderAll(); setEditing(editing);
    });
    wrap.appendChild(bar);
    return wrap;
  }

  function node(n, s, i) {
    var d = document.createElement('div');
    var st = d.style;
    if (n.t === 'line') {
      var dx = n.x2 - n.x1, dy = n.y2 - n.y1, len = Math.sqrt(dx * dx + dy * dy);
      d.className = 'of-line';
      st.left = px(n.x1); st.top = px(n.y1); st.width = px(len);
      st.height = (n.w * 96 / 72) + 'px'; st.marginTop = -(n.w * 96 / 144) + 'px';
      st.background = '#' + n.color; st.transform = 'rotate(' + Math.atan2(dy, dx) + 'rad)';
      return d;
    }
    st.left = px(n.x); st.top = px(n.y); st.width = px(n.w); st.height = px(n.h);
    if (n.t === 'rect' || n.t === 'ell') {
      d.className = 'of-shape';
      if (n.fill) st.background = '#' + n.fill;
      if (n.line) st.border = (n.line.w * 96 / 72) + 'px solid #' + n.line.color;
      st.borderRadius = n.t === 'ell' ? '50%' : px(n.r || 0);
      if (n.shadow) st.boxShadow = '0 14px 40px rgba(30,42,74,.12), 0 2px 6px rgba(30,42,74,.05)';
      return d;
    }
    if (n.t === 'img') {
      d.className = 'of-img'; d.dataset.key = n.key; d.dataset.i = i;
      st.borderRadius = n.circle ? '50%' : (n.radii || [0, 0, 0, 0]).map(px).join(' ');
      var src = get(s, n.key);
      if (src) { st.backgroundImage = 'url("' + src + '")'; }
      else { d.classList.add('empty'); d.textContent = 'Click to add image'; }
      d.addEventListener('click', function () { if (editing) pickImage(i, n.key); });
      return d;
    }
    // text
    d.className = 'of-text' + (n.list ? ' list' : '');
    st.fontFamily = fontStack(n.font); st.fontWeight = n.weight; st.fontSize = (n.size * 96 / 72) + 'px';
    st.lineHeight = n.lh; st.color = '#' + n.color.replace('#', ''); st.textAlign = n.align;
    if (n.ls) st.letterSpacing = n.ls + 'em';
    st.justifyContent = n.valign === 'middle' ? 'center' : n.valign === 'bottom' ? 'flex-end' : 'flex-start';
    var val = n.value != null ? n.value : get(s, n.key);
    if (n.list) {
      var ul = document.createElement('ul');
      (val || []).forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
      d.appendChild(ul);
    } else {
      var span = document.createElement('div'); span.className = 'of-t'; span.textContent = val == null ? '' : val; d.appendChild(span);
    }
    if (!n.locked) {
      d.dataset.key = n.key; d.dataset.i = i; d.classList.add('editable');
      d.addEventListener('input', function () {
        var v = n.list ? Array.prototype.map.call(d.querySelectorAll('li'), function (li) { return li.innerText.trim(); }).filter(Boolean)
                       : d.innerText.replace(/\n+$/, '');
        set(model.slides[i], n.key, v); persist(); checkOverflow();
      });
      d.addEventListener('paste', function (ev) {
        ev.preventDefault();
        var t = (ev.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, t);
      });
    }
    return d;
  }

  function pickImage(i, key) {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { set(model.slides[i], key, r.result); persist(); renderAll(); setEditing(true); };
      r.readAsDataURL(f);
    };
    inp.click();
  }

  function setEditing(on) {
    editing = on; document.body.classList.toggle('of-editing', on);
    document.querySelectorAll('.of-text.editable').forEach(function (t) { t.contentEditable = on ? 'true' : 'false'; });
    var b = document.getElementById('of-edit'); if (b) b.textContent = on ? 'Done editing' : 'Edit';
  }

  function checkOverflow() {
    var count = 0;
    document.querySelectorAll('.of-text.editable').forEach(function (t) {
      var over = t.scrollHeight > t.clientHeight + 2 || t.scrollWidth > t.clientWidth + 2;
      t.classList.toggle('overflow', over); if (over) count++;
    });
    document.body.dataset.overflow = count;
    var b = document.getElementById('of-warn');
    if (b) { b.textContent = count ? count + ' text box' + (count > 1 ? 'es' : '') + ' overflowing' : ''; }
    return count;
  }

  function fitScale() {
    var w = Math.min(window.innerWidth - 48, 1440);
    var k = w / (W * PX);
    document.documentElement.style.setProperty('--of-k', k);
  }

  var STORE = 'of-deck:' + location.pathname;
  function persist() { try { localStorage.setItem(STORE, JSON.stringify(model)); } catch (e) {} }

  function saveHtml() {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#of-root').innerHTML = '';
    clone.querySelector('#deck-data').textContent = JSON.stringify(model).replace(/</g, '\\u003c');
    clone.querySelector('body').className = '';
    var blob = new Blob(['<!doctype html>\n' + clone.outerHTML], { type: 'text/html' });
    download(blob, slug() + '.html');
  }
  function slug() { return ((model.meta && model.meta.title) || 'deck').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function download(blob, name) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ======================= PowerPoint export ======================= */
  function loadImage(src) {
    return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = rej; im.src = src; });
  }
  // Crop to cover the box and clip to rounded corners or a circle, like the browser does.
  function raster(src, n) {
    return loadImage(src).then(function (im) {
      var dpi = 160, cw = Math.round(n.w * dpi), ch = Math.round(n.h * dpi);
      var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
      var g = cv.getContext('2d');
      var iw = im.naturalWidth || im.width || cw, ih = im.naturalHeight || im.height || ch;
      var sc = Math.max(cw / iw, ch / ih), dw = iw * sc, dh = ih * sc;
      g.beginPath();
      if (n.circle) g.ellipse(cw / 2, ch / 2, cw / 2, ch / 2, 0, 0, Math.PI * 2);
      else {
        var r = (n.radii || [0, 0, 0, 0]).map(function (v) { return v * dpi; });
        g.moveTo(r[0], 0); g.lineTo(cw - r[1], 0); g.quadraticCurveTo(cw, 0, cw, r[1]);
        g.lineTo(cw, ch - r[2]); g.quadraticCurveTo(cw, ch, cw - r[2], ch);
        g.lineTo(r[3], ch); g.quadraticCurveTo(0, ch, 0, ch - r[3]);
        g.lineTo(0, r[0]); g.quadraticCurveTo(0, 0, r[0], 0);
      }
      g.closePath(); g.clip();
      g.drawImage(im, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      return cv.toDataURL('image/png');
    });
  }

  function pptFace(n) {
    var f = (model.meta && model.meta.pptFonts) || {};
    if (n.font === 'head') {
      if (n.weight >= 900) return { face: f.black || 'Montserrat Black', bold: false };
      if (n.weight >= 800) return { face: f.extrabold || 'Montserrat ExtraBold', bold: false };
      return { face: f.head || 'Montserrat', bold: true };
    }
    return { face: f.body || 'Arial', bold: n.weight >= 600 };
  }

  function exportPptx() {
    var pptx = new PptxGenJS();
    pptx.defineLayout({ name: 'OF', width: W, height: H }); pptx.layout = 'OF';
    pptx.title = (model.meta && model.meta.title) || 'Deck';
    var jobs = [];
    model.slides.forEach(function (s, i) {
      var sl = pptx.addSlide(); sl.background = { color: C.white };
      if (s.notes) sl.addNotes(s.notes);
      var els = scene(s, { i: i, n: model.slides.length, footer: (model.meta || {}).footer });
      // keep z-order: reserve each image's slot by collecting work in order
      var ops = els.map(function (n) {
        if (n.t !== 'img') return Promise.resolve({ n: n });
        var src = get(s, n.key);
        if (!src) return Promise.resolve({ n: n, empty: true });
        return raster(src, n).then(function (data) { return { n: n, data: data }; }, function () { return { n: n, empty: true }; });
      });
      jobs.push(Promise.all(ops).then(function (rs) { rs.forEach(function (r) { drawPpt(pptx, sl, r, s); }); }));
    });
    return Promise.all(jobs).then(function () { return pptx.writeFile({ fileName: slug() + '.pptx' }); });
  }

  function drawPpt(pptx, sl, r, s) {
    var n = r.n, S = pptx.ShapeType || pptx.shapes;
    if (n.t === 'rect') {
      var o = { x: n.x, y: n.y, w: n.w, h: n.h, fill: { color: n.fill }, line: { color: n.fill, width: 0, transparency: 100 } };
      if (n.r) o.rectRadius = n.r;
      if (n.shadow) o.shadow = { type: 'outer', color: C.shadow, opacity: 0.14, blur: 22, offset: 8, angle: 90 };
      sl.addShape(n.r ? S.roundRect : S.rect, o);
    } else if (n.t === 'ell') {
      var e = { x: n.x, y: n.y, w: n.w, h: n.h };
      e.fill = n.fill ? { color: n.fill } : { type: 'none' };
      e.line = n.line ? { color: n.line.color, width: n.line.w } : { color: n.fill || 'FFFFFF', width: 0, transparency: 100 };
      sl.addShape(S.ellipse, e);
    } else if (n.t === 'line') {
      sl.addShape(S.line, { x: Math.min(n.x1, n.x2), y: Math.min(n.y1, n.y2), w: Math.max(Math.abs(n.x2 - n.x1), 0.001), h: Math.max(Math.abs(n.y2 - n.y1), 0.001),
        flipV: (n.x2 - n.x1) * (n.y2 - n.y1) < 0, line: { color: n.color, width: n.w } });
    } else if (n.t === 'img') {
      if (r.empty) {
        sl.addShape(n.circle ? S.ellipse : S.rect, { x: n.x, y: n.y, w: n.w, h: n.h, fill: { color: C.soft }, line: { color: C.line, width: 1 } });
      } else sl.addImage({ data: r.data, x: n.x, y: n.y, w: n.w, h: n.h });
    } else if (n.t === 'text') {
      var val = n.value != null ? n.value : get(s, n.key);
      if (val == null || val === '' || (Array.isArray(val) && !val.length)) return;
      var f = pptFace(n);
      var base = { x: n.x, y: n.y, w: n.w, h: n.h, margin: 0, fontFace: f.face, bold: f.bold, fontSize: n.size,
        color: n.color.replace('#', ''), align: n.align, valign: n.valign, lineSpacingMultiple: +(n.lh / 1.2).toFixed(2), fit: 'none' };
      if (n.ls) base.charSpacing = +(n.ls * n.size).toFixed(1);
      if (n.list) {
        var runs = val.map(function (t) { return { text: t, options: { bullet: { code: '25CF', indent: 16 }, paraSpaceAfter: 5, breakLine: true } }; });
        sl.addText(runs, base);
      } else sl.addText(String(val), base);
    }
  }

  /* ======================= Boot ======================= */
  function boot() {
    root = document.getElementById('of-root');
    model = JSON.parse(document.getElementById('deck-data').textContent);
    var fresh = new URLSearchParams(location.search).has('fresh');
    try { var saved = !fresh && localStorage.getItem(STORE); if (saved) model = JSON.parse(saved); } catch (e) {}
    document.title = (model.meta && model.meta.title) || document.title;
    renderAll();
    var q = function (id) { return document.getElementById(id); };
    q('of-edit').onclick = function () { setEditing(!editing); };
    q('of-pdf').onclick = function () { setEditing(false); window.print(); };
    q('of-pptx').onclick = function () {
      var b = q('of-pptx'); b.disabled = true; b.textContent = 'Building…';
      exportPptx().catch(function (e) { alert('PowerPoint export failed: ' + e.message); })
        .then(function () { b.disabled = false; b.textContent = 'PowerPoint'; });
    };
    q('of-save').onclick = saveHtml;
    q('of-reset').onclick = function () {
      if (!confirm('Discard your browser edits and go back to the original deck?')) return;
      try { localStorage.removeItem(STORE); } catch (e) {}
      model = JSON.parse(document.getElementById('deck-data').textContent); renderAll(); setEditing(editing);
    };
    q('of-present').onclick = present;
    window.addEventListener('resize', fitScale);
    document.fonts && document.fonts.ready.then(checkOverflow);
  }

  function present() {
    setEditing(false);
    var idx = 0, wraps = document.querySelectorAll('.of-wrap');
    var vis = function () { wraps.forEach(function (w, i) { w.classList.toggle('on', i === idx); }); };
    document.body.classList.add('of-present'); vis();
    var k = function () { document.documentElement.style.setProperty('--of-k', Math.min(innerWidth / (W * PX), innerHeight / (H * PX))); };
    k(); window.addEventListener('resize', k);
    var key = function (e) {
      if (['ArrowRight', 'PageDown', ' ', 'Enter'].indexOf(e.key) > -1) idx = Math.min(idx + 1, wraps.length - 1);
      else if (['ArrowLeft', 'PageUp', 'Backspace'].indexOf(e.key) > -1) idx = Math.max(idx - 1, 0);
      else if (e.key === 'Escape') { done(); return; } else return;
      e.preventDefault(); vis();
    };
    var click = function () { idx = Math.min(idx + 1, wraps.length - 1); vis(); };
    function done() {
      document.body.classList.remove('of-present'); wraps.forEach(function (w) { w.classList.remove('on'); });
      document.removeEventListener('keydown', key); root.removeEventListener('click', click); window.removeEventListener('resize', k);
      if (document.fullscreenElement) document.exitFullscreen(); fitScale();
    }
    document.addEventListener('keydown', key); root.addEventListener('click', click);
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
    document.addEventListener('fullscreenchange', function f() { if (!document.fullscreenElement) { done(); document.removeEventListener('fullscreenchange', f); } });
  }

  window.OpenField = { layouts: Object.keys(L), exportPptx: exportPptx, checkOverflow: checkOverflow, scene: scene, get model() { return model; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
